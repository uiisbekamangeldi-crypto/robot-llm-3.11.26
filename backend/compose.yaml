name: robot-llm-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: robot_llm
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot_llm"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.12-alpine3.22
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: robot-llm-minio:source-2025-09-07
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
  init:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.init_storage"]
    environment:
      DATABASE_URL: postgresql+asyncpg://robot:${POSTGRES_PASSWORD}@postgres:5432/robot_llm
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: knowledge-documents
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "-t", "4"]
    volumes:
      - ./.models/llm:/models:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://robot:${POSTGRES_PASSWORD}@postgres:5432/robot_llm
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: knowledge-documents
      LLM_URL: http://llm:8080
      EMBEDDING_CACHE_DIR: /app/.models
      TTS_VOICE_DIR: /app/.models/voices
      DIALOG_API_KEY: ${DIALOG_API_KEY:-}
    volumes:
      - ./.models:/app/.models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      init: {condition: service_completed_successfully}
      llm: {condition: service_started}
  worker:
    build: .
    command: ["python", "-m", "scripts.knowledge_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://robot:${POSTGRES_PASSWORD}@postgres:5432/robot_llm
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: knowledge-documents
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      init: {condition: service_completed_successfully}
volumes:
  postgres_data:
  redis_data:
  minio_data:
